<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogeMiner - Espace Membre</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ========================================== -->
    <!-- 1. FORMULAIRE DE CONNEXION & INSCRIPTION -->
    <!-- ========================================== -->
    <div id="auth-card" class="max-w-md w-full bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-yellow-400 flex items-center justify-center gap-2">
                🐕 DogeMiner
            </h1>
            <p id="auth-subtitle" class="text-xs text-gray-400 mt-1">Connectez-vous pour commencer à miner</p>
        </div>

        <!-- Message d'erreur / succès -->
        <p id="auth-msg" class="text-xs mb-4 text-center min-h-[16px]"></p>

        <!-- Formulaire -->
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Adresse Email</label>
                <input type="email" id="auth-email" required placeholder="nom@exemple.com" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Mot de passe</label>
                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
            </div>

            <button type="submit" id="auth-submit-btn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-2 rounded-lg transition duration-200">
                Se Connecter
            </button>
        </form>

        <!-- Basculer entre Connexion et Inscription -->
        <div class="mt-4 text-center">
            <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-gray-400 hover:text-yellow-400 underline">
                Pas encore de compte ? S'inscrire
            </button>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 2. TABLEAU DE BORD (Masqué par défaut) -->
    <!-- ========================================== -->
    <div id="dashboard-card" class="hidden max-w-md w-full bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700 space-y-6">
        <!-- En-tête Tableau de bord -->
        <div class="flex items-center justify-between border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2">🐕 DogeMiner</h1>
                <p id="user-email-display" class="text-[10px] text-gray-400"></p>
            </div>
            <button onclick="logout()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1 rounded-lg transition">
                Déconnexion
            </button>
        </div>

        <!-- Statistiques de Minage -->
        <div class="space-y-3">
            <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-700/50">
                <p class="text-xs text-gray-400 mb-1">Solde Miner (DOGE)</p>
                <div id="balance" class="text-3xl font-extrabold text-yellow-400 font-mono">0.000000</div>
            </div>

            <div class="flex gap-4">
                <div class="flex-1 bg-gray-900/60 p-4 rounded-xl border border-gray-700/50">
                    <p class="text-xs text-gray-400 mb-1">Puissance</p>
                    <p class="text-lg font-bold text-white"><span id="hashrate">15.5</span> MH/s</p>
                </div>
                <div class="flex-1 bg-gray-900/60 p-4 rounded-xl border border-gray-700/50">
                    <p class="text-xs text-gray-400 mb-1">Gain / sec</p>
                    <p class="text-lg font-bold text-white"><span id="rate">0.000155</span></p>
                </div>
            </div>
        </div>

        <!-- Tâches -->
        <div class="border-t border-gray-700 pt-4">
            <h2 class="text-sm font-semibold mb-3 text-gray-300">⚡ Tâches & Bonus</h2>
            <div class="space-y-2">
                <div class="flex items-center justify-between bg-gray-900/40 p-3 rounded-lg border border-gray-700/40">
                    <div>
                        <p class="text-xs font-bold text-white">Abonnement Twitter</p>
                        <p class="text-[10px] text-gray-400">+2.5 MH/s</p>
                    </div>
                    <button id="task-1-btn" onclick="completeTask(1, 2.5)" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 text-xs font-bold px-3 py-1.5 rounded transition">
                        Réclamer
                    </button>
                </div>
            </div>
        </div>

        <!-- Parrainage -->
        <div class="border-t border-gray-700 pt-4">
            <h2 class="text-sm font-semibold mb-2 text-gray-300">🤝 Mon Lien d'Affiliation</h2>
            <div class="flex gap-2">
                <input type="text" id="ref-link" readonly class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 focus:outline-none">
                <button onclick="copyRefLink()" class="bg-gray-700 hover:bg-gray-600 text-xs font-bold px-3 py-1.5 rounded text-white transition">Copier</button>
            </div>
        </div>

        <!-- Retrait -->
        <div class="border-t border-gray-700 pt-4">
            <h2 class="text-sm font-semibold mb-3 text-gray-300">💸 Demander un Retrait</h2>
            <form id="withdraw-form" onsubmit="handleWithdraw(event)" class="space-y-3">
                <input type="text" id="wallet" required placeholder="Adresse Dogecoin" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
                <input type="number" id="amount" required step="any" min="10" placeholder="Montant DOGE (Min: 10)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-2 rounded-lg transition duration-200">Retirer</button>
            </form>
            <p id="withdraw-msg" class="text-xs mt-2 text-center min-h-[16px]"></p>
        </div>
    </div>

    <!-- LOGIQUE JS -->
    <script>
        let isSignUp = false;
        let currentUser = JSON.parse(localStorage.getItem('doge_session')) || null;

        let hashrate = 15.5;
        let balance = 10.000000;
        let completedTasks = [];
        let miningInterval = null;

        // Basculer Inscription / Connexion
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-subtitle').innerText = isSignUp ? "Créer un compte pour commencer" : "Connectez-vous pour commencer à miner";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "S'inscrire" : "Se Connecter";
            document.getElementById('auth-toggle-btn').innerText = isSignUp ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
            document.getElementById('auth-msg').innerText = "";
        }

        // Simuler la Connexion / Inscription
        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const msgEl = document.getElementById('auth-msg');

            if (password.length < 6) {
                msgEl.className = "text-xs mb-4 text-center text-red-400";
                msgEl.innerText = "Le mot de passe doit contenir au moins 6 caractères.";
                return;
            }

            // Enregistrer la session utilisateur
            currentUser = { email: email, id: 'usr_' + Math.random().toString(36).substring(2, 9) };
            localStorage.setItem('doge_session', JSON.stringify(currentUser));

            msgEl.className = "text-xs mb-4 text-center text-green-400";
            msgEl.innerText = isSignUp ? "Compte créé avec succès !" : "Connexion réussie !";

            setTimeout(() => {
                showDashboard();
            }, 600);
        }

        function showDashboard() {
            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('dashboard-card').classList.remove('hidden');
            document.getElementById('user-email-display').innerText = currentUser.email;
            document.getElementById('ref-link').value = `${window.location.origin}?ref=${currentUser.id}`;

            // Charger les données utilisateur
            hashrate = parseFloat(localStorage.getItem(`hashrate_${currentUser.email}`)) || 15.5;
            balance = parseFloat(localStorage.getItem(`balance_${currentUser.email}`)) || 10.000000;
            completedTasks = JSON.parse(localStorage.getItem(`tasks_${currentUser.email}`)) || [];

            completedTasks.forEach(id => updateTaskUI(id));

            // Démarrer la boucle de minage
            if (!miningInterval) {
                miningInterval = setInterval(updateMining, 100);
            }
        }

        function logout() {
            localStorage.removeItem('doge_session');
            clearInterval(miningInterval);
            miningInterval = null;
            location.reload();
        }

        function updateMining() {
            const ratePerSec = hashrate * 0.00001;
            balance += ratePerSec / 10;
            
            document.getElementById('balance').innerText = balance.toFixed(6);
            document.getElementById('hashrate').innerText = hashrate.toFixed(1);
            document.getElementById('rate').innerText = ratePerSec.toFixed(6);

            localStorage.setItem(`balance_${currentUser.email}`, balance.toString());
            localStorage.setItem(`hashrate_${currentUser.email}`, hashrate.toString());
        }

        function completeTask(taskId, bonus) {
            if (completedTasks.includes(taskId)) return;
            hashrate += bonus;
            completedTasks.push(taskId);
            localStorage.setItem(`tasks_${currentUser.email}`, JSON.stringify(completedTasks));
            updateTaskUI(taskId);
        }

        function updateTaskUI(taskId) {
            const btn = document.getElementById(`task-${taskId}-btn`);
            if (btn) {
                btn.innerText = "Complété ✓";
                btn.disabled = true;
                btn.className = "bg-gray-700 text-gray-400 text-xs font-bold px-3 py-1.5 rounded cursor-not-allowed";
            }
        }

        function copyRefLink() {
            const refInput = document.getElementById('ref-link');
            refInput.select();
            navigator.clipboard.writeText(refInput.value);
            alert("Lien de parrainage copié !");
        }

        function handleWithdraw(e) {
            e.preventDefault();
            const wallet = document.getElementById('wallet').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const msgEl = document.getElementById('withdraw-msg');

            if (amount > balance) {
                msgEl.className = "text-xs mt-2 text-center text-red-400";
                msgEl.innerText = "❌ Solde insuffisant !";
                return;
            }

            balance -= amount;
            localStorage.setItem(`balance_${currentUser.email}`, balance.toString());
            msgEl.className = "text-xs mt-2 text-center text-green-400";
            msgEl.innerText = `✅ Retrait de ${amount} DOGE envoyé !`;
            document.getElementById('withdraw-form').reset();
        }

        // Vérifier si une session est déjà active au chargement
        if (currentUser) {
            showDashboard();
        }
    </script>
</body>
</html>
